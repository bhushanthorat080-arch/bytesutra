<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Byte Sutra</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #1e3a8a;
      --color-secondary: #0ea5e9;
      --color-accent: #7c3aed;
      --font-sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: #020617;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glows */
    .glow-1 {
      position: absolute;
      top: -10%;
      left: 10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(30, 58, 138, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .glow-2 {
      position: absolute;
      bottom: -10%;
      right: 10%;
      width: 40vw;
      height: 40vw;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Main Container */
    .container {
      max-width: 600px;
      width: 90%;
      text-align: center;
      z-index: 10;
    }

    /* Glassmorphism Card */
    .card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 48px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 32px;
      font-weight: 850;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* Action buttons */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    @media (min-width: 480px) {
      .button-group {
        flex-direction: row;
        justify-content: center;
      }
    }

    .btn {
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 14px 28px;
      border-radius: 100px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--color-primary) 0%, #1545bf 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(30, 58, 138, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(30, 58, 138, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .links-grid {
      margin-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 24px;
      display: grid;
      grid-template-cols: repeat(3, 1fr);
      gap: 12px;
    }

    .footer-link {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--color-secondary);
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <div class="card">
      <div class="icon">🌌</div>
      <h1>Path Lost In Transit</h1>
      <p>The requested page layout compile did not materialize. This could be due to a deprecated link, or a typing typo. Let's redirect you back to active systems.</p>
      
      <div class="button-group">
        <a href="/" class="btn btn-primary">
          Back to active base
        </a>
        <a href="https://wa.me/919272503104" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
          Chat on WhatsApp
        </a>
      </div>

      <div class="links-grid">
        <a href="/#services" class="footer-link">Services</a>
        <a href="/#portfolio" class="footer-link">Case Studies</a>
        <a href="/#contact" class="footer-link">Contact</a>
      </div>
    </div>
  </div>
</body>
</html>
